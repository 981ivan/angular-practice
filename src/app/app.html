<app-search-form
  (search)="filterSearch($event)"
  (cleanSearch)="initialSearch()"
  [allYearsAndLanguages]="allYearsAndLanguages.value()"/>

<app-book-list
  [books]="books.value()"
  [sortBy]="sortBy()"
  (orderedBy)="orderBy($event)"
/>

<app-paginator
  [numberOfPages]="numberOfPages()"
  [(selectedPage)]="selectedPage"
  (changePage)="changePage($event)"
/>
